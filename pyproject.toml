[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specflow-demo"
version = "0.1.0"
description = "A local spec-driven agent engineering workflow with executable TDD gates"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
specflow = "specflow.cli:main"

[tool.setuptools.packages.find]
include = ["specflow*"]

[tool.setuptools.package-data]
specflow = ["sample/*", "sample/tests/*"]
